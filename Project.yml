name: ImageRelayClient
options:
  minimumXcodeGenVersion: "2.42"
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: com.oliverames
  xcodeVersion: "26"
  groupSortPosition: top

packages:
  ImageRelayKit:
    path: ImageRelayKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""

targets:
  ImageRelayClient:
    type: application
    platform: macOS
    sources:
      - path: ImageRelayClient
    dependencies:
      - package: ImageRelayKit
      - target: FileProviderExtension
        embed: true
        codeSign: false
    entitlements:
      path: ImageRelayClient/ImageRelayClient.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.oliverames.imagerelay-client
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: "ImageRelay Client"

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
    dependencies:
      - package: ImageRelayKit
    entitlements:
      path: FileProviderExtension/FileProviderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.oliverames.imagerelay-client
    info:
      path: FileProviderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)com.oliverames.imagerelay-client
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Extension
        CFBundleSymbolName: cloud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.fileprovider
