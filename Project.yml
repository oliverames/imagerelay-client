name: ImageRelayClient
options:
  minimumXcodeGenVersion: "2.42"
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  bundleIdPrefix: com.oliverames
  groupSortPosition: top

packages:
  ImageRelayKit:
    path: ImageRelayKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: PV3W52NDZ3
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "27"
    ENABLE_HARDENED_RUNTIME: YES

schemes:
  ImageRelayClient:
    build:
      targets:
        ImageRelayClient: [run, profile, analyze, archive]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ImageRelayKit/ImageRelayKitTests
        - FileProviderExtensionTests
    archive:
      config: Release

  ImageRelayClientiOS:
    build:
      targets:
        ImageRelayClientiOS: [run, profile, analyze, archive]
    run:
      config: Debug
    archive:
      config: Release

targets:
  ImageRelayClient:
    type: application
    platform: macOS
    sources:
      - path: ImageRelayClient
    dependencies:
      - package: ImageRelayKit
      - package: Sparkle
        product: Sparkle
      - target: FileProviderExtension
        embed: true
        codeSign: false
    entitlements:
      path: ImageRelayClient/ImageRelayClient.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        com.apple.security.scripting-targets:
          com.apple.finder:
            - com.apple.finder.idle
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    settings:
      base:
        PRODUCT_NAME: "Image Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ImageRelayClient/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "ImageRelayClient Developer ID"

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
    dependencies:
      - package: ImageRelayKit
    entitlements:
      path: FileProviderExtension/FileProviderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    info:
      path: FileProviderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Extension
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: ImageRelayMark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.fileprovider
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "ImageRelayClient FileProviderExtension Developer ID"

  FileProviderExtensionTests:
    # Standalone unit-test bundle for FileProviderExtension classes. We compile
    # the extension's sources directly into the test target rather than linking
    # the extension binary — extensions are not built with `-enable-testing`
    # for distribution, and depending on the extension target as a build product
    # also drags in its provisioning profile requirements (the extension is
    # codeSign: false / embed-only inside the host app). The trade-off: source
    # changes here must mirror any path changes in the FileProviderExtension
    # `sources:` block above.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FileProviderExtensionTests
      - path: FileProviderExtension
    dependencies:
      - package: ImageRelayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.fileprovider.tests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO

  ImageRelayClientiOS:
    type: application
    platform: iOS
    sources:
      - path: ImageRelayClientiOS
      # The service+state files are pure Swift and reused on both platforms.
      # Views stay platform-specific; iOS gets its own NavigationStack/Form-driven UIs.
      - path: ImageRelayClient/Collections/CollectionsService.swift
      - path: ImageRelayClient/Products/ProductsService.swift
      - path: ImageRelayClient/LibraryAdmin/LibraryAdminService.swift
    dependencies:
      - package: ImageRelayKit
      - target: FileProviderExtensioniOS
        embed: true
        codeSign: true
    entitlements:
      path: ImageRelayClientiOS/ImageRelayClientiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client.ios
    info:
      path: ImageRelayClientiOS/Info.plist
      properties:
        CFBundleDisplayName: "Image Relay"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: "Image Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.ios
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ImageRelayClientiOS/Info.plist
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic

  FileProviderExtensioniOS:
    type: app-extension
    platform: iOS
    sources:
      - path: FileProviderExtensioniOS
    dependencies:
      - package: ImageRelayKit
    entitlements:
      path: FileProviderExtensioniOS/FileProviderExtensioniOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client.ios
    info:
      path: FileProviderExtensioniOS/Info.plist
      properties:
        NSExtension:
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderSupportsPickingFolders: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Extension
        CFBundleDisplayName: "Image Relay"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.ios.fileprovider
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
