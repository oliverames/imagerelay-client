name: ImageRelayClient
options:
  minimumXcodeGenVersion: "2.42"
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: com.oliverames
  groupSortPosition: top

packages:
  ImageRelayKit:
    path: ImageRelayKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: PV3W52NDZ3
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ImageRelayClient:
    type: application
    platform: macOS
    sources:
      - path: ImageRelayClient
    dependencies:
      - package: ImageRelayKit
      - target: FileProviderExtension
        embed: true
        codeSign: false
    entitlements:
      path: ImageRelayClient/ImageRelayClient.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    settings:
      base:
        PRODUCT_NAME: "Image Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: "Image Relay"
        INFOPLIST_KEY_CFBundleName: "Image Relay"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
    dependencies:
      - package: ImageRelayKit
    entitlements:
      path: FileProviderExtension/FileProviderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    info:
      path: FileProviderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Extension
        CFBundleSymbolName: cloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.fileprovider
