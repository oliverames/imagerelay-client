name: ImageRelayClient
options:
  minimumXcodeGenVersion: "2.42"
  deploymentTarget:
    macOS: "26.0"
  bundleIdPrefix: com.oliverames
  groupSortPosition: top

packages:
  ImageRelayKit:
    path: ImageRelayKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: PV3W52NDZ3
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "16"
    ENABLE_HARDENED_RUNTIME: YES

schemes:
  ImageRelayClient:
    build:
      targets:
        ImageRelayClient: [run, profile, analyze, archive]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ImageRelayKit/ImageRelayKitTests
    archive:
      config: Release

targets:
  ImageRelayClient:
    type: application
    platform: macOS
    sources:
      - path: ImageRelayClient
    dependencies:
      - package: ImageRelayKit
      - package: Sparkle
        product: Sparkle
      - target: FileProviderExtension
        embed: true
        codeSign: false
    entitlements:
      path: ImageRelayClient/ImageRelayClient.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    settings:
      base:
        PRODUCT_NAME: "Image Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ImageRelayClient/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "ImageRelayClient Developer ID"

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProviderExtension
    dependencies:
      - package: ImageRelayKit
    entitlements:
      path: FileProviderExtension/FileProviderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.oliverames.imagerelay-client
    info:
      path: FileProviderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)group.com.oliverames.imagerelay-client
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Extension
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: ImageRelayMark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverames.imagerelay-client.fileprovider
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "ImageRelayClient FileProviderExtension Developer ID"
