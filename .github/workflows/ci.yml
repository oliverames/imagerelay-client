name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-kit:
    name: ImageRelayKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Swift test
        working-directory: ImageRelayKit
        run: swift test

  build:
    name: Build (host app + extension)
    # The app and File Provider extension target macOS 26 APIs. macos-latest can
    # lag behind the newest SDK, so run the Xcode project job on the explicit
    # macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve ImageRelayKit dependencies
        # Pre-populate Package.resolved so xcodebuild does not need to perform
        # network resolution via Xcode's own resolver (which can fail in CI).
        working-directory: ImageRelayKit
        run: swift package resolve

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check patch whitespace
        run: git diff --check

      - name: Resolve Xcode package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ImageRelayClient.xcodeproj \
            -scheme ImageRelayClient

      - name: Test ImageRelayClient scheme
        run: |
          xcodebuild \
            -project ImageRelayClient.xcodeproj \
            -scheme ImageRelayClient \
            -destination "platform=macOS" \
            test

      - name: Build ImageRelayClient
        run: |
          xcodebuild \
            -project ImageRelayClient.xcodeproj \
            -scheme ImageRelayClient \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build ImageRelayClientiOS
        run: |
          xcodebuild \
            -project ImageRelayClient.xcodeproj \
            -scheme ImageRelayClientiOS \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
