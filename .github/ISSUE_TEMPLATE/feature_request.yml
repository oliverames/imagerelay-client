name: Feature request
description: Suggest a sync, Finder, settings, or Image Relay API enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Image Relay Client do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Finder sync
        - Uploads
        - Downloads
        - Metadata
        - Settings
        - Updates
        - Diagnostics
        - Documentation
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Additional context
