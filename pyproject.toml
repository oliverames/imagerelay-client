[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imagerelay-client"
version = "0.1.0"
description = "Desktop sync client MVP for Image Relay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oliver Ames" }]
dependencies = [
  "click>=8.1.7",
  "packaging>=24.0",
  "requests>=2.32.3",
  "rumps>=0.4.0; platform_system == 'Darwin'",
  "watchdog>=4.0.1",
]

[project.scripts]
imagerelay-client = "imagerelay_client.cli:main"
imagerelay-client-gui = "imagerelay_client.gui:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
